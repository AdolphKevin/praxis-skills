# SOP-VERIFY-2：看板客户端与以用例为准的验收场景
# 预期只依据 sop-board 仓库 docs/proposals/2026-10-19-standalone-sop-verification.md（v8）的 D2、D3、D9、D16、D23、D29 与第 4 节 S1、S2、S7，
# 本仓 docs/designs/SOP-VERIFY-2.md（修订 2）的 I1–I4、D1–D4，以及 sop-board 仓库 docs/designs/SOP-BOARD-1.md 至 SOP-BOARD-3.md 的看板接口；不依据当前实现的输出。
# 版本 1（2026-10-20）：Claude 依据上述原文与测试代理 sop-verify-2-tester 的 61 条用例编写，经 AdolphKevin 授权由 Claude 代批。
#
# 共用定义：
# “候选脚本”指本仓候选版 sop-verify/scripts/sop.py，以 python3 <候选脚本> <子命令> 运行；“状态目录”指 XDG_STATE_HOME 指向的临时目录下的 sop-verify 目录（SOP_VERIFY_STATE 未设置，另有说明除外）。
# “演示仓库”指执行者新建的临时 Git 仓库：根目录名 demo-app，origin 为 https://github.com/demo-org/demo-app.git（项目身份 github.com/demo-org/demo-app，项目键 github-com-demo-org-demo-app），
# git config user.name 为 Alice Dev；已提交 app.txt、docs/demo-sop.md、docs/sop/entries.yaml（只声明 cli 入口）与 docs/sop/demo.yaml（合格场景文件：metadata.batch 为 demo，
# metadata.sources 一项 ref 为 docs/demo-sop.md 第 1 节、confirmed_by 为 AdolphKevin；节点 N1、N2，场景 N1-P01、N1-N01、N2-P01、N2-N01，verify 均为 cli）；没有 .tw/，工作区干净。
# “合格结果文件”指仓库外结果目录中的 results.jsonl：覆盖演示仓库四条场景，均为 pass，各引用结果目录内的一份证据文件，executor 为 exec-session-1，executed_at 为带时区的当前时间。
# “真实看板”指在 sop-board 检出目录以 SOP_BOARD_TOKEN=<场景给出的令牌，缺省 tok-demo> uv run sop-board --data <新建临时目录> --port <空闲端口> 启动的测试看板，不带 --writable-repo。
# “记录代理”指执行者用标准库 http.server 写的转发服务：把请求原样转发到真实看板并原样返回响应，记下每个请求的方法、路径与查询串、请求头、正文及看板的响应；
# 可按设置在取得某个请求的看板响应后暂缓返回，待执行者放行。需要核对请求细节的真实看板场景令 SOP_BOARD_URL 指向记录代理。
# “模拟看板”指执行者用标准库 http.server 写的服务：按 SOP-BOARD-1 至 3 的接口路径与响应格式记下每个请求（方法、路径与查询串、请求头、正文）并返回场景预设的响应；
# 只用于真实看板不便构造的情形：超时、非 JSON 响应、指定的失败响应、合并任务、指定的队列与回归检查结果。
# “看板模式”指 SOP_BOARD_URL 指向场景所给的看板地址、SOP_BOARD_TOKEN 为该看板的写入令牌；“批次页面地址”指 <去掉末尾斜杠的 SOP_BOARD_URL>/p/<项目键>/b/<批次>。
# “退款仓库”指未接入 tw 的临时业务仓库：origin 为 https://github.com/demo-org/refund-app.git；docs/退款SOP.md 写明退款流程；scripts/refund.py 实现该流程，tests/ 下有 pytest 单元测试与接口测试；
# docs/sop/entries.yaml 只声明 cli 入口、没有 checks；docs/sop/refund.yaml 为已确认的合格场景文件（批次 refund，节点 SOP-01，场景 SOP-01-P01、SOP-01-P02、SOP-01-N01、SOP-01-N02）。
# “测试岗用例文件”指退款仓库外符合测试岗 Schema 的 cases.yaml：TC_REFUND_FLOW_001、002（section:申请退款）与 003、004（section:审核退款），003 的 tags 含 negative；
# TC_REFUND_FLOW_002 与 SOP-01-P02 表述不同而角色、初始状态、入口与全部预期相同；SOP-01-N02 的预期与任何用例都不同。
# “技能会话”指只装候选 sop-verify 技能的新会话，在退款仓库中按场景原话执行；会话请求确认时由执行者以 SOP 负责人身份答复。
# 版本 2（2026-10-20）：按测试代理 sop-verify-2-tester 的复核补全断言（pending 只读、regression_status 取值与缺失、复核意见、未知检查字段、项目不存在、批次冲突在推送前），经 AdolphKevin 授权由 Claude 代批。

