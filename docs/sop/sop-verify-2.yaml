        expected: ["POST /api/v1/evidence 恰好 2 次，正文分别为两份不同内容的原始字节，各带 X-Evidence-Name 头", "全部证据上传都在 POST rounds 之前", "rounds 正文的 idempotency_key 等于场景文件 sha256 与结果文件 sha256 两个十六进制字符串直接拼接后再取的 sha256", "scenario_file_sha256 为场景文件原文的 sha256", "implementer 为 Bob，submitted_by 为 Alice Dev", "product 含登记前计算的 commit、digest 与 dirty，digest 与 PUT scenario-file 正文的 product_digest 相同", "results 每条含 scenario、该场景当前内容指纹 fingerprint、status、actual、executed_at、executor 与 evidence，evidence 为 {name, sha256} 数组，sha256 与对应文件内容一致", "看板返回的证据字节与对应文件相同"]
        forbidden_effects: ["同一内容的证据上传两次", "证据复制到状态目录"]
