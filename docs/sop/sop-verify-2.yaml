  requirement: "sop-verify 看板客户端与以用例为准：看板配置与推送登记、读取看板、取回合并结果、入口与检查声明、技能文本、驱动的结果输出与引用更正"
  batch: "sop-verify-2"
  version: 2
  owner: "AdolphKevin"
  sources:
    - ref: "AdolphKevin/sop-board docs/proposals/2026-10-19-standalone-sop-verification.md 的 D2、D3、D9、D16、D23、D29 与第 4 节 S1、S2、S7"
      version: "v8（2026-10-19）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-VERIFY-2.md 的 I1–I4、D1–D4 节"
      version: "修订 2"
      confirmed_by: "AdolphKevin"
  tags: ["sop-verify", "看板模式", "以用例为准"]

sops:

  - id: SOP-21
    title: "看板配置与推送登记"
    actor: "开发者"
    entry: "sop.py submit 与 import-cases（看板模式），未设置看板时的各子命令"
    must:
      - "设置 SOP_BOARD_URL 时场景文件、证据与轮次推送到看板，本机不留轮次与证据"
      - "看板失败时按错误代码如实报告，不退回本机模式，令牌不出现在任何输出中"
      - "未设置 SOP_BOARD_URL 时行为与 SOP-VERIFY-1 相同"
    scenarios:

      - id: SOP-21-P01
        polarity: positive
        title: "看板模式下 submit 依次推送场景文件、上传证据、登记轮次，输出轮次、统计、批次页面地址与待执行清单"
        actor: "开发者"
        priority: P0
        refs: ["I1", "I2", "I3"]
        verify: cli
        initial_state: ["演示仓库，origin 改为 git@github.com:Demo-Org/demo-app.git", "真实看板以 tok-cfg-001 为写入令牌启动，记录代理转发到它；看板上批次 demo 已由两次 submit 以不同的结果文件登记第 1、2 轮，四条场景均为 pass", "SOP_BOARD_URL 为记录代理地址并带末尾斜杠，如 http://127.0.0.1:<端口>/；SOP_BOARD_TOKEN 为 tok-cfg-001", "结果目录甲的 results.jsonl 覆盖四条场景：N1-P01、N1-N01、N2-P01 为 pass，N2-N01 为 fail，各附一份证据；结果目录乙内容相同而 executed_at 更晚"]
        steps: ["记录演示仓库的 git status 与状态目录文件清单", "在仓库根目录运行 python3 <候选脚本> submit docs/sop/demo.yaml --results <结果目录甲>/results.jsonl --implementer Bob", "运行 python3 <候选脚本> submit docs/sop/demo.yaml --results <结果目录乙>/results.jsonl --implementer Bob --format json", "查看记录代理记下的第一次 submit 的请求与响应", "请求真实看板的 GET /api/v1/projects/github-com-demo-org-demo-app/batches/demo，打开批次页面", "再次记录 git status 与状态目录文件清单"]
        expected: ["第一次退出码为 0，输出轮次号 3、与记录代理记下的 POST rounds 响应中 statistics 相同的统计，以及批次页面地址 http://127.0.0.1:<端口>/p/github-com-demo-org-demo-app/b/demo", "第一次输出的登记后待执行清单只含 N2-N01，原因为 failed", "第二次退出码为 0，json 输出 ok 为 true，含轮次号 4、统计、同一批次页面地址与待执行清单", "记录代理记下第一次 submit 先后发出 PUT /api/v1/projects/github-com-demo-org-demo-app/batches/demo/scenario-file、POST /api/v1/evidence 与 POST /api/v1/projects/github-com-demo-org-demo-app/batches/demo/rounds，登记之后才有读取请求；所有请求路径中都没有双斜杠", "每个 PUT 与 POST 请求都带请求头 Authorization: Bearer tok-cfg-001", "PUT scenario-file 正文的 project.id 为 github.com/demo-org/demo-app，project.name 为 demo-app", "真实看板的批次 demo 有第 3、4 轮，第 3 轮中 N2-N01 为 fail，批次页面的轮次表列出第 1 至 4 轮"]
        forbidden_effects: ["状态目录中出现 rounds 目录、round.json 或证据副本", "演示仓库的 git status 或文件清单发生变化"]
        evidence_hints: ["两次命令原文与完整输出", "记录代理的请求记录", "批次接口响应与批次页面截图", "前后的 git status 与状态目录文件清单"]

      - id: SOP-21-P02
        polarity: positive
        title: "推送场景文件的正文含产品信息、内容指纹、所用入口声明与仓库内的 SOP 原文"
        actor: "开发者"
        priority: P0
        refs: ["I2"]
        verify: cli
        initial_state: ["演示仓库另已提交 docs/refund-sop.md；docs/sop/entries.yaml 另声明入口 api，含 candidate: checkout；demo.yaml 的 metadata.sources 改为两项：ref 为 docs/refund-sop.md 第 2 节（confirmed_by 张三）与 ref 为 https://wiki.example.com/x（confirmed_by 李四）", "另有 docs/sop/other.yaml（批次 other）的 sources 只有指向仓库外地址的 ref，docs/sop/anchor.yaml（批次 anchor）的 sources 一项 ref 为 docs/refund-sop.md#第-2-节 修订 3（confirmed_by 王五）；三份场景文件均已提交，工作区干净", "真实看板与记录代理，看板模式；每份场景文件在仓库外各有一份合格结果文件", "已用 check docs/sop/demo.yaml --format json 记下该文件的 sha256 与每条场景的内容指纹，并按 SOP-VERIFY-1 方案 D2 独立计算演示仓库的产品指纹"]
        steps: ["运行 submit docs/sop/demo.yaml --results <demo 结果>/results.jsonl --implementer Bob", "运行 submit docs/sop/other.yaml --results <other 结果>/results.jsonl", "修改 docs/refund-sop.md 后不提交，运行 submit docs/sop/anchor.yaml --results <anchor 结果>/results.jsonl", "执行 git config --unset user.name 后，把 demo.yaml 复制为批次 demo-2 的 docs/sop/demo-2.yaml 并运行 submit", "取记录代理记下的四个 PUT scenario-file 正文"]
        expected: ["demo 的正文含 project {id, name}、path 为 docs/sop/demo.yaml、commit 为 HEAD 提交号、dirty 为 false、product_digest、content、fingerprints、pushed_by、entries 与 sop_sources", "content 与 docs/sop/demo.yaml 原文逐字节相同，fingerprints 与 check 输出的内容指纹一一相同，product_digest 等于独立计算的产品指纹", "demo 的 pushed_by 为 Alice Dev；取消 user.name 后 demo-2 的 pushed_by 为 sop-verify", "demo 的 entries 等于 docs/sop/entries.yaml 解析后的内容对象，其中入口 api 含 candidate: checkout", "demo 的 sop_sources 恰有一项：ref 为 docs/refund-sop.md 第 2 节，path 为 docs/refund-sop.md，content 为该文件原文，sha256 为该原文的 sha256，commit 为 HEAD 提交号，confirmed_by 为 张三", "other 的正文没有 sop_sources 字段", "anchor 的 sop_sources 恰有一项，path 为 docs/refund-sop.md，content 为修改后工作区中的原文，sha256 与之相符，commit 为 HEAD 提交号，confirmed_by 为 王五", "四次 submit 退出码均为 0"]
        forbidden_effects: ["sop_sources 中出现 https://wiki.example.com/x 的内容或仓库外文件", "submit 修改仓库内任何文件"]
        evidence_hints: ["四次命令的完整输出", "四个 PUT 正文", "check 输出与独立计算产品指纹的脚本及输出", "docs/refund-sop.md 两个版本的 sha256"]

      - id: SOP-21-P03
